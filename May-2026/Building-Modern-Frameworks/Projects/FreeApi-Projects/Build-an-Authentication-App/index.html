<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Auth App</title>
</head>
<body>

  <!-- REGISTER -->
  <div id="registerSection">
    <h2>Register</h2>
    <form id="registerForm">
      <input type="email" placeholder="Email" id="regEmail" required />
      <input type="text" placeholder="Username" id="regUsername" required />
      <input type="password" placeholder="Password" id="regPassword" required />
      <input type="text" placeholder="Role (ADMIN)" id="regRole" required />
      <button type="submit">Register</button>
    </form>
    <p id="registerMsg"></p>
    <button onclick="showLogin()">Go to Login</button>
  </div>

  <!-- LOGIN -->
  <div id="loginSection">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" placeholder="Username" id="loginUsername" required />
      <input type="password" placeholder="Password" id="loginPassword" required />
      <button type="submit">Login</button>
    </form>
    <p id="loginMsg"></p>
    <button onclick="showRegister()">Go to Register</button>
  </div>

  <!-- PROFILE -->
  <div id="profileSection" style="display:none;">
    <h2>Profile</h2>
    <p id="userData"></p>
    <button id="logoutBtn">Logout</button>
  </div>

  <script src="index.js"></script>
</body>
</html>
