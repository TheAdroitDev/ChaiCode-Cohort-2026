<!-- Create a semantic figure with an image and caption. Use <figure> to wrap an image and <figcaption> to add a descriptive caption.
 -->
<!DOCTYPE html>
<html>

<head>
    <title>Image Captions</title>
</head>

<body>
    <h1>Gallery</h1>
    <!-- Create a figure with image and caption -->
    <figure>
        <img src="https://vastu-mentor.vercel.app/assets/images/logo.png">
        <figcaption> Magic Happens</figcaption>
    </figure>
</body>

</html>
