<!-- Create an input with a datalist for autocomplete suggestions. Users can type freely but get helpful suggestions. -->

<!DOCTYPE html>
<html>
  <head>
    <title>Autocomplete</title>
  </head>
  <body>
    <h1>Course Search</h1>
    <!-- Create input with datalist -->
     <form action="#">
        <input type="text" list="SsSh">
        <datalist id="SsSh">
            <option value="Twilight">Twilight</option>
            <option value="Yor">Yor</option>
            <option value="Anya">Anya</option>
            <option value="Fiona">Fiona</option>
            <option value="Yuri">Yuri</option>
        </datalist>
     </form>
  </body>
</html>
