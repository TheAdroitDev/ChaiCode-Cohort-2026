<!-- Create a form with required fields and placeholders. Use the required attribute to make fields mandatory and placeholder for hints. -->

<!DOCTYPE html>
<html>
  <head>
    <title>Required Fields</title>
  </head>
  <body>
    <h1>Contact Us</h1>
    <!-- Create a form with required fields and placeholders -->
     <form action="#">
        <input placeholder="Enter your Name" required type="name">
        <input placeholder="Enter your Email" required type="Email">
        <input placeholder="Enter your Password" required type="password">
     </form>
  </body>
</html>
