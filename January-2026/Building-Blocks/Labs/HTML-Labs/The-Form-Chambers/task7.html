<!-- Instructions
Create a form with file upload input. Use accept attribute to specify allowed file types and multiple to allow multiple files. -->

<!DOCTYPE html>
<html>
  <head>
    <title>File Upload</title>
  </head>
  <body>
    <h1>ChaiCode Project Submission</h1>
    <!-- Create a form with file upload -->

    <form action="#">
        <label for="fileT">Only PDF files are accepted</label>
        <input accept=".pdf," multiple type="file" name="file" id="fileT">
    </form>
  </body>
</html>
