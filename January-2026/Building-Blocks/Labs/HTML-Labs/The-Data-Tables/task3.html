<!-- Create a table with a <caption> element that describes the table content. Add headers and data rows -->
<!DOCTYPE html>
<html>

<head>
    <title>Table Captions</title>
</head>

<body>
    <h1>Student Progress</h1>
    <!-- Create a table with caption -->
    <table>
        <caption>About Teachers</caption>
        <thead>
            <tr>
                <th>Hitesh Choudhary</th>
                <th>Piyush Garg</th>
                <th>Suraj Jha</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Lead Instructor</td>
                <td>Co Instructor</td>
                <td>Legendary Coder</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td>14 Years +</td>
                <td>8 Years +</td>
                <td>7 Years +</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
