<!-- Create a table using rowspan to make cells span multiple rows. Show grouped or categorized data. -->

<!DOCTYPE html>
<html>
  <head>
    <title>Row Spanning</title>
  </head>
  <body>
    <h1>ChaiCode Course Categories</h1>
    <!-- Create a table with rowspan -->
     <table>
        <caption>Courses</caption>
        <thead>
            <tr>
                <th>Web Development</th>
                <td>System Design</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">6 Months</td>
                <td>Life Long Learners</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td>₹8,999</td>
                <td>₹14,999</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td>₹4,999</td>
                <td>₹8,999</td>
            </tr>
        </tbody>
    </table>
  </body>
</html>
