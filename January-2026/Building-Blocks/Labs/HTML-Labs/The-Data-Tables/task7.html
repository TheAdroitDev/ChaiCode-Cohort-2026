<!-- Create a complete table with <thead>, <tbody>, and <tfoot> sections. The footer should show totals or summary data. -->

<!DOCTYPE html>
<html>
  <head>
    <title>Table Footer</title>
  </head>
  <body>
    <h1>Sales Report</h1>
    <!-- Create a table with tfoot -->
     <table>
        <caption>Spy x Family</caption>
        <colgroup>Characters</colgroup>
        <thead>
        <tr>
            <th>Loid Forger</th>
            <th>Anya Forger</th>
            <th>Yor Forger</th>
            <th>Fiona Frost</th>
            <th>Franky</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Spy</td>
            <td>Telepath</td>
            <td>Assasin</td>
            <td>Emotionless</td>
            <td>Emotional Fool</td>
        </tr>
        <tr>
            <td>My Favorite</td>
            <td>The Cutest</td>
            <td>Mommy Baddie</td>
            <td>Serious Maniac</td>
            <td>Buddy</td>
        </tr>
        <tr>
            <td>Genius</td>
            <td>Happy</td>
            <td>Dumbo</td>
            <td>Good Enough</td>
            <td>Kid</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td>Wins</td>
            <td>Sleep</td>
            <td>Kills</td>
            <td>Hard Work</td>
            <td>Cry</td>
        </tr>
        </tfoot>
     </table>
  </body>
</html>
