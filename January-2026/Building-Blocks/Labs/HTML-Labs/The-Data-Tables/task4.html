<!-- Create a table using colspan to make a cell span multiple columns. Show a schedule or timetable format. -->
<!DOCTYPE html>
<html>
  <head>
    <title>Column Spanning</title>
  </head>
  <body>
    <h1>ChaiCode About Teachers</h1>
    <!-- Create a table with colspan -->
    <table>
        <caption>About Teachers</caption>
        <thead>
            <tr>
                <th colspan="2">Hitesh Choudhary</th>
                <th colspan="2">Piyush Garg</th>
                <th>Suraj Jha</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td colspan="2">Lead Instructor</td>
                <td>Co Instructor</td>
                <td colspan="2">Legendary Coder</td>
            </tr>
        </tbody>
        <tbody>
            <tr>
                <td colspan="2">14 Years +</td>
                <td colspan="2">8 Years +</td>
                <td>7 Years +</td>
            </tr>
        </tbody>
    </table>
  </body>
</html>
