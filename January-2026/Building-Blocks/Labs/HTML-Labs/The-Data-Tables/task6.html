<!-- Create a table with <colgroup> and <col> elements to group and style columns. Use <col> to define column properties. -->

<!DOCTYPE html>
<html>
  <head>
    <title>Column Groups</title>
  </head>
  <body>
    <h1>Monthly Report</h1>
    <!-- Create a table with colgroup -->
      <table>
        <caption>Spy x Family</caption>
        <colgroup>Characters
            <col><col span="2">
        </colgroup>
        <thead>
        <tr>
            <th>Loid Forger</th>
            <th>Anya Forger</th>
            <th>Yor Forger</th>
        </tr>
        </thead>
        <tr>
            <td>Spy</td>
            <td>Telepath</td>
            <td>Assasin</td>
        </tr>
        <tr>
            <td>Twilight</td>
            <td>Subject 007</td>
            <td>Thorn Princess</td>
        </tr>
     </table>
  </body>
</html>
