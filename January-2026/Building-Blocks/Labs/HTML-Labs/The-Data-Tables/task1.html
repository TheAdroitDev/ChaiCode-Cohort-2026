<!-- Create a simple table with 3 rows and 3 columns. Learn the basic structure of <table>, <tr>, and <td> tags. -->

<!DOCTYPE html>
<html>
  <head>
    <title>Basic Tables</title>
  </head>
  <body>
    <h1>My First Table</h1>
    <!-- Create a table here -->
     <h2>Spy x Family Characters</h1>
     <table>
        <tr>
            <td>Loid Forger</td>
            <td>Anya Forger</td>
            <td>Yor Forger</td>
        </tr>
        <tr>
            <td>Spy</td>
            <td>Telepath</td>
            <td>Assasin</td>
        </tr>
        <tr>
            <td>Twilight</td>
            <td>Subject 007</td>
            <td>Thorn Princess</td>
        </tr>
     </table>
  </body>
</html>
